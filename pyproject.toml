[build-system]
requires = ["setuptools>=82,<83", "wheel>=0.46,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "condor-local"
version = "2.0.0"
description = "Condor - assistente pessoal local, seguro e multiplataforma"
requires-python = ">=3.11"
readme = "README.md"
license = "LicenseRef-Proprietary"
dependencies = [
  "openai>=2.50,<3",
  "cryptography>=48,<51",
  "fastapi>=0.136,<1",
  "uvicorn[standard]>=0.47,<1",
  "pywebview>=6.2,<7",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "psutil>=7.2,<8",
  "pyautogui>=0.9.54,<1",
  "pyperclip>=1.11,<2",
  "pillow>=12.2,<13",
  "pypdf>=6.14,<7",
  "pvporcupine>=4.0,<5",
  "pvrecorder>=1.2,<2",
  "faster-whisper>=1.2,<2",
  "piper-tts>=1.7,<2",
]

[project.scripts]
condor = "condor.__main__:main"

[tool.setuptools.packages.find]
include = ["condor*"]

[tool.setuptools.package-data]
condor = ["ui/**/*"]
