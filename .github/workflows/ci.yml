name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python testes/rodar_testes.py
      - run: python testes/test_assistant.py
      - run: python -m pip install "pytest==9.1.1"
      - run: python -m pytest -q testes/test_camera.py testes/test_gestos.py testes/test_programacao.py testes/test_seguranca.py testes/test_celular.py testes/test_consciencia.py
      - run: node --test testes/voice_lifecycle.cjs testes/celular_audio.cjs testes/intencao_imagem.cjs
      - run: python -m pip install "bandit==1.9.4" "pip-audit==2.10.1"
      - run: python -m bandit -r condor condor_app.pyw condor_window.pyw -lll
      - run: python -m pip_audit -r requirements.txt

